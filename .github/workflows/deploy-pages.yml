name: Deploy Edge Atlas

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: edge-atlas-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Stage public files
        run: |
          mkdir -p "$RUNNER_TEMP/edge-atlas-public"
          cp -R index.html figures previews media "$RUNNER_TEMP/edge-atlas-public/"
      - name: Publish to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: 'false'
        run: |
          : "${CLOUDFLARE_API_TOKEN:?Add the CLOUDFLARE_API_TOKEN repository secret}"
          : "${CLOUDFLARE_ACCOUNT_ID:?Add the CLOUDFLARE_ACCOUNT_ID repository secret}"
          npx --yes wrangler@4.166.0 pages deploy "$RUNNER_TEMP/edge-atlas-public" --project-name edge-atlas --branch main --commit-hash "$GITHUB_SHA"
      - name: Check the production homepage
        run: |
          for attempt in {1..12}; do
            if curl --fail --silent --show-error --max-time 10 \
              "https://edge-atlas-4xa.pages.dev/?deploy_check=${GITHUB_SHA}-${attempt}" \
              --output "$RUNNER_TEMP/edge-atlas-live.html" &&
              cmp -s index.html "$RUNNER_TEMP/edge-atlas-live.html"; then
              exit 0
            fi
            sleep 5
          done
          echo 'The production homepage did not match this revision after waiting for propagation.' >&2
          exit 1
